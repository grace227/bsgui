# Complete tab and widget configuration for the Beamline Control GUI.

app:
  title: Beamline Control
  window_size: [1200, 800]
  toolbar:
    enabled: true
    actions:
      - id: open_xrf_file
        text: Open XRF File…
        shortcut: Ctrl+O
        tooltip: Select an XRF data file to visualize
        target_widget: scan_setup

tabs:
  - key: scan_setup
    title: Scan Setup
    description: Configure XRF and/or Ptychography loaders that share a plotting canvas.
    start_expanded: true
    options:
      roi_precision: 2
      point_precision: 2
      # Estimated scan time settings. Add beamline-specific plan parameter
      # names here instead of changing Python code. The estimate is:
      # points * dwell_seconds + lines * line_overhead_seconds.
      plan_time:
        line_overhead_seconds: 2.5
        aliases:
          width:
            - energy_width_keV
          stepsize_x:
            - energy_step_keV
          dwell:
            - dwell_s
            - dwell_ms
      loaders:
        xrf:
          enabled: true
          loader_path: "mic_vis.bnp.io:load_bnp_h5_file"
          search_paths:
            - ./data/img.dat
          file_patterns:
            - "*.h5"
          elements:
            - Total_Fluores
        ptycho:
          enabled: true
          loader_path: "mic_vis.common.load_ptycho:load_ptycho_data"
          search_paths:
            - ./data/img.dat
          mda_file_patterns:
            - "bnp_fly{scan_number:04d}.mda"
      plan_editor:
        enabled: true
        planning_column_order:
          - "{iterate_variable}"
          - x_center
          - y_center
          - sample_z
        kinds:
          - single
          - batch
        plans:
          - kind: single
          - kind: batch
        kind_parameters:
          batch:
            - name: iterate_variable
              description: Name of one of the plan's variables to iterate over
              default: smp_theta
              iterate_actions:
                theta:
                  text: Batch theta transform
                  qserver_function: syncXYZ_transform
                  call_kwargs:
                    require_theta_zero: false
                  input_map:
                    x: x0
                    y: y0
                    z: z0
                    theta: __iterate_value__
                  result_target: parameters
            - name: iterate_starting_value
              description: Starting value of the iterate variable
              default: 0.0
            - name: iterate_ending_value
              description: Ending value of the iterate variable
              default: 10.0
            - name: iterate_step_size
              description: Step size of the iterate variable
              default: 0.1
        roi_key_map:
          samplename:
            - samplename
          title:
            - user_comment
            - user_comments
            - title
          width:
            - width_mm
            - width
          height:
            - height_mm
            - height
          x:
            - x_center
          y:
            - y_center
          z: 
            - sample_z
          dwell:
            - dwell_ms
            - dwell_s
            - dwell
          stepsize_x:
            - stepsize_x
          stepsize_y:
            - stepsize_y
          theta:
            - target_theta
            - smp_theta
            - theta
        roi_context_map:
          z: sample_z
          theta: sample_theta
        sync_inputs:
          - name: x0
            label: x0
            type_name: float
            editable: true
          - name: y0
            label: y0
            type_name: float
            editable: true
          - name: z0
            label: z0
            type_name: float
            editable: true
          - name: theta
            label: theta
            type_name: float
            editable: true
            placeholder: Target theta
        sync_buttons:
          - text: sync XYZ
            qserver_function: syncXYZ
            result_keys:
              - x
              - y
              - z
              - theta
            result_target: parameters
            input_result_behavior:
              condition_key: theta
              zero_tolerance: 0.2
              zero_updates:
                x0: x
                y0: y
                z0: z
              nonzero_reset:
                - x0
                - y0
                - z0
          - text: sync XYZ + transform
            qserver_function: syncXYZ_transform
            call_kwargs:
              require_theta_zero: true
            input_map:
              x: x0
              y: y0
              z: z0
              theta: theta

      queue_status:
        enabled: true
        layout_slot: queue_status
        labels:
          connected:
            title: "QServer Connected:"
            label: Disconnected
          qserver_address:
            title: "QServer Address:"
            label: Unknown
          manager_state:
            title: "QServer State:"
            label: Unknown
          re_state:
            title: "RunEngine State:"
            label: Unknown
          worker_environment_exists:
            title: "Worker Environment Exists:"
            label: Unknown
          worker_environment_state:
            title: "Worker Environment Status:"
            label: Unknown
          items_in_history:
            title: "Items In History:"
            label: Unknown
          running_item_uid:
            title: "Running Item UID:"
            label: Unknown
          items_in_queue:
            title: "Items In Queue:"
            label: Unknown
        data_management:
          enabled: true
          title: Data Management
          fields:
            - name: experiment_name
              label: Experiment Name
              default: "2026-3_bsdm"
              tooltip: "Example: 2026-3_blueskydm"
              required: true
            - name: root_path
              label: Cycle Number
              default: "2026-3"
              tooltip: "Example: 2026-3"
              required: true
            - name: esaf_id
              label: ESAF Number (Optional)
              tooltip: "Optional ESAF number. If provided, ESAF users are linked to the DM experiment."
              type_name: int
            - name: data_directory
              label: Data Directory
              default: "/net/micdata/data1/bnp/2026-3/blueskydm"
              tooltip: "Local folder watched by DM. Example: /net/micdata/data1/2idd/2026-3/blueskydm"
              required: true
            - name: process_existing
              label: Process Existing Files
              default: "true"
              type_name: bool
            - name: max_run_time_hours
              label: Max Run Time Hours
              default: "1000"
              type_name: float
          action_note: "Create the experiment before starting DAQ."
          actions:
            - text: Create Experiment
              qserver_function: create_dm_experiment
              timeout: 30.0
              input_map:
                experiment_name: experiment_name
                root_path: root_path
                esaf_id: esaf_id
            - text: Start DAQ
              qserver_function: start_dm_daq
              timeout: 30.0
              input_map:
                experiment_name: experiment_name
                data_directory: data_directory
                process_existing: process_existing
                max_run_time_hours: max_run_time_hours


      console_output:
        enabled: true
        layout_slot: console_output
        title: "QServer Console"
        max_entries: 1000
        auto_scroll: true


      layout:
        type: grid
        components:
          loader_panel:
            row: 0
            column: 0
            row_span: 1
            column_span: 2
          plan_editor:
            row: 1
            column: 2
            row_span: 4
            column_span: 1
          queue_status:
            row: 0
            column: 2
            row_span: 1
            column_span: 1
          canvas:
            row: 1
            column: 0
            row_span: 3
            column_span: 2
          console_output:
            row: 4
            column: 0
            row_span: 1
            column_span: 2
        row_stretch:
          "0": 0
          "1": 1
          "2": 1
          "3": 0
          "4": 0
        column_stretch:
          "0": 1
          "1": 1
          "2": 0

  - key: qserver_monitor
    title: Queue Monitor
    description: Monitor Bluesky Queue Server status, pending plans, and progress.
    start_expanded: true
    options:
      poll_interval_ms: 5000
      auto_connect: true
      show_completed_limit: 15
      progress:
        mode: queue
        show_activity_indicator: true
        show_percentage: true
      client:
        type: zmq
        endpoints:
          info_env_var: QSERVER_ZMQ_INFO_ADDRESS
      control_env_var: QSERVER_ZMQ_CONTROL_ADDRESS
      columns:
        - id: x0
          label: x0
          stretch: true
        - id: y0
          label: y0
          stretch: true
        - id: z0
          label: z0
          stretch: true

  - key: scan_monitor
    title: Scan Monitor
    description: Monitor scan status.
    start_expanded: true
    options:
      enabled: true
      poll_interval_ms: 5000
      auto_connect: true
      detector_recovery_cooldown_seconds: 30.0
      detector_retries: 1
      detector_timeout_factor: 3.0
      sample_position_tolerance: 0.1
  
  - key: scan_parameter_viewer
    title: Parameter Viewer
    description: Browse Bluesky HDF5 files and inspect extracted scan plan arguments.
    start_expanded: true
    options:
      enabled: true
      search_paths:
        - /net/micdata/data1/bnp/2026-1/blueskydev/bluesky
      file_patterns:
        - "*.h5"
      loader_path: "mic_vis.common.load_meta:load_bluesky_meta"
      parameter_key_map:
        X:
          - sample_x
          - x_center
          - x_center_mm
          - x
        Y:
          - sample_y
          - y_center
          - y_center_mm
          - y
        Z:
          - sample_z
          - z_center
          - z_center_mm
          - z
        Theta:
          - target_theta
          - smp_theta
          - theta

layout:
  type: tabs
  tab_order:
    - scan_setup
    - qserver_monitor
    - beamline_monitor
    - scan_parameter_viewer
  status_bar:
    enabled: true
    messages:
      idle: Ready.
      loading_data: Loading data file…
      queue_refresh: Updating queue status…
